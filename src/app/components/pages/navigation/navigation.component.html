<!-- Skip Navigation Link -->
<a class="skip-link" href="#about" data-testid="skip-link">{{
  'navigation.skipToContent' | translate
}}</a>

<!-- Navigation-->
<nav
  class="navbar navbar-expand-lg navbar-dark fixed-top"
  id="mainNav"
  data-testid="main-navigation"
  role="navigation"
  [attr.aria-label]="'navigation.ariaLabel' | translate"
>
  <div class="container">
    <a class="navbar-brand" href="#page-top">
      <img
        ngSrc="assets/img/others/robsonalves.png"
        [alt]="'navigation.logoAlt' | translate"
        width="224"
        height="38"
        priority
        sizes="(max-width: 768px) 50vw, 20vw"
      />
    </a>
    <!-- Language switcher e theme toggle à esquerda do menu -->
    <div class="d-flex align-items-center me-2">
      <app-language-switcher (languageSelected)="closeMenu()"></app-language-switcher>
      <app-theme-toggle />
    </div>
    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleMenu()"
      aria-controls="navbarResponsive"
      [attr.aria-expanded]="isMenuOpen()"
      [attr.aria-label]="'navigation.toggleNavigation' | translate"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div
      class="collapse navbar-collapse"
      [class.show]="isMenuOpen()"
      id="navbarResponsive"
      #navbarCollapse
    >
      <ul class="navbar-nav text-uppercase ms-auto py-4 py-lg-0 nav">
        <li class="nav-item">
          <a
            class="nav-link"
            [class.active]="activeSection() === 'about'"
            href="#about"
            [attr.aria-label]="'navigation.about' | translate"
            (click)="sobreAnalitics($event)"
            data-testid="nav-about"
            >{{ 'navigation.about' | translate }}</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            [class.active]="activeSection() === 'skills'"
            href="#skills"
            [attr.aria-label]="'navigation.skills' | translate"
            (click)="skillsAnalitics($event)"
            data-testid="nav-skills"
            >{{ 'navigation.skills' | translate }}</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            [class.active]="educationSections.includes(activeSection())"
            href="#graduation"
            [attr.aria-label]="'navigation.education' | translate"
            (click)="graduationAnalitics($event)"
            data-testid="nav-graduation"
            >{{ 'navigation.education' | translate }}</a
          >
        </li>
        <li class="nav-item">
          <a
            class="nav-link"
            [class.active]="activeSection() === 'contact'"
            href="#contact"
            [attr.aria-label]="'navigation.contact' | translate"
            (click)="contactAnalitics($event)"
            data-testid="nav-contact"
            >{{ 'navigation.contact' | translate }}</a
          >
        </li>
      </ul>
    </div>
  </div>
</nav>
