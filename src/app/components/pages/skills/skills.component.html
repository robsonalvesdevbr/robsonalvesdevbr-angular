<!-- Skills -->
<section class="page-section" id="skills" data-testid="skills-section" [ngClass]="currentClass()">
  <div class="container">
    <div class="text-center mb-5">
      <h2 class="section-heading text-uppercase">{{ 'skills.title' | translate }}</h2>
      <h3 class="section-subheading text-muted">{{ 'skills.subtitle' | translate }}</h3>
    </div>
    <div class="row g-4">
      @for (group of skillGroups; track group.id) {
        <div class="col-md-6 col-lg-4">
          <div class="card h-100 bg-body-tertiary">
            <div class="card-body">
              <h4 class="h5 card-title mb-3">{{ 'skills.groups.' + group.id | translate }}</h4>
              <ul class="list-unstyled d-flex flex-wrap gap-2 mb-0">
                @for (skill of group.skills; track skill) {
                  <li>
                    <span class="badge rounded-pill border bg-body text-body fw-normal fs-6">{{
                      skill
                    }}</span>
                  </li>
                }
              </ul>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
