<!-- Footer-->
<footer class="site-footer">
  <div class="container">
    <div class="site-footer-row">
      <span>&copy; {{ 'footer.copyright' | translate: { year: currentYear } }}</span>
      <span class="site-footer-links">
        <a
          href="https://startbootstrap.com/theme/agency"
          target="_blank"
          rel="noopener"
          (click)="onFooterLinkClick('startbootstrap')"
          >{{ 'footer.pageTemplate' | translate }}</a
        >
        <a
          href="https://github.com/robsonalvesdevbr/robsonalvesdevbr-angular"
          target="_blank"
          rel="noopener"
          (click)="onFooterLinkClick('github_repo')"
          >{{ 'footer.sourceCode' | translate }}</a
        >
      </span>
    </div>
    <p class="site-footer-about">{{ 'footer.about' | translate }}</p>
  </div>
</footer>
