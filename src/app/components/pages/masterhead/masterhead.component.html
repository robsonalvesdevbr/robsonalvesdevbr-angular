<!-- Masthead-->
<header class="masthead" data-testid="masthead">
  <div class="container">
    <div class="bento">
      <div class="tile tile--span-8 tile--row-2 hero-main">
        <p class="eyebrow masthead-subheading">{{ 'masterhead.role' | translate }}</p>
        <h1 class="masthead-heading">{{ 'masterhead.name' | translate }}</h1>
        <p class="masthead-tagline">{{ 'masterhead.tagline' | translate }}</p>
        <div class="masthead-actions">
          <a
            class="btn-hero btn-hero--primary"
            href="#contact"
            data-testid="masthead-contact"
            (click)="onContactClick()"
            >{{ 'masterhead.contact' | translate }}</a
          >
          <a
            class="btn-hero btn-hero--ghost"
            [href]="linkedInUrl"
            target="_blank"
            rel="noopener"
            data-testid="masthead-linkedin"
            (click)="onLinkedInClick()"
            >LinkedIn</a
          >
          <a
            class="btn-hero btn-hero--ghost"
            [href]="resumeUrl"
            target="_blank"
            rel="noopener"
            data-testid="masthead-resume"
            (click)="onResumeClick()"
            ><i class="bi bi-file-earmark-pdf me-2" aria-hidden="true"></i
            >{{ 'masterhead.resume' | translate }}</a
          >
        </div>
      </div>

      <figure class="tile tile--span-4 tile--row-2 hero-photo">
        <img
          ngSrc="assets/img/profile-hero.webp"
          [alt]="'contact.photoAlt' | translate"
          class="masthead-photo"
          width="1000"
          height="913"
          sizes="(max-width: 860px) 100vw, 33vw"
          priority
        />
        <figcaption>{{ profile.city }} · {{ profile.state }}</figcaption>
      </figure>

      <div class="hero-stats tile--span-12">
        @for (stat of stats; track stat.labelKey) {
          <div class="tile" data-testid="masthead-stat">
            <span class="stat-value">{{ stat.value }}</span>
            <span class="stat-label">{{ stat.labelKey | translate }}</span>
          </div>
        }
      </div>
    </div>
  </div>
</header>
